name: Send diff to Discord

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Send diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            diff=$'diff --git a/rules/template.md b/rules/template.md\n--- a/rules/template.md\n+++ b/rules/template.md\n@@ -1,3 +1,3 @@\n # Example rule\n-Old rule text\n+Updated rule text'
          elif [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            diff="$(git show --format= --unified=1 "$AFTER" -- rules/ || true)"
          else
            diff="$(git diff --unified=1 "$BEFORE" "$AFTER" -- rules/ || true)"
          fi

          if [[ -z "$diff" ]]; then
            diff="No textual changes."
          elif (( ${#diff} > 1750 )); then
            diff="${diff:0:1725}"$'\n… diff truncated'
          fi

          payload="$(jq -n \
            --arg content $'```diff\n'"$diff"$'\n```' \
            '{content: $content, allowed_mentions: {parse: []}}')"

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
