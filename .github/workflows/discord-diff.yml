name: Send diff to Discord

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Send diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            message_sha="$(git log -1 --format=%H -- rules/)"
            commit_title="$(git log -1 --format=%s "$message_sha")"
            diff="$(git show --format= --unified=1 "$message_sha" -- rules/ || true)"
          elif [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            message_sha="$AFTER"
            commit_title="$(git log -1 --format=%s "$AFTER")"
            diff="$(git show --format= --unified=1 "$AFTER" -- rules/ || true)"
          else
            message_sha="$AFTER"
            commit_title="$(git log -1 --format=%s "$AFTER")"
            diff="$(git diff --unified=1 "$BEFORE" "$AFTER" -- rules/ || true)"
          fi

          if [[ -z "$diff" ]]; then
            diff="No textual changes."
          elif (( ${#diff} > 1400 )); then
            diff="${diff:0:1375}"$'\n… diff truncated'
          fi

          commit_title="${commit_title:0:120}"
          repository_name="${REPOSITORY#*/}"
          commit_url="$SERVER_URL/$REPOSITORY/commit/$message_sha"
          website_url="https://$REPOSITORY_OWNER.github.io/$repository_name/"
          message="Rules updated: $commit_title"$'\n'"Commit: <$commit_url>"$'\n'"Website: <$website_url>"$'\n\n```diff\n'"$diff"$'\n```'

          payload="$(jq -n \
            --arg content "$message" \
            '{content: $content, flags: 4, allowed_mentions: {parse: []}}')"

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
